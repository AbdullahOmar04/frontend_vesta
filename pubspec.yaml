name: frontend_vesta
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.1.4
  firebase_core: ^4.1.0
  cloud_firestore: ^6.1.2
  fl_chart: ^1.1.1
  http: ^1.6.0
  intl: ^0.20.2
  async: ^2.13.0
  share_plus: ^12.0.1
  app_links: ^7.0.0
  freerasp: ^7.3.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.2.1
  firebase_storage: ^13.0.6
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  assets:
    - .env
    - assets/images/choose_bank.png
    - assets/images/LOGO_APP-ICON-DARK.png
    - assets/images/vesta_head.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: PPNeueBit
      fonts:
        - asset: assets/fonts/PPNeueBit-Bold.otf
          weight: 700
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
