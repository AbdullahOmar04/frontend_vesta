name: frontend_vesta
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter  
  firebase_auth: ^6.0.2
  firebase_core: ^4.1.0
  cloud_firestore: ^6.0.1
  fl_chart: ^1.1.1
  http: ^1.5.0
  intl: ^0.20.2
  async: ^2.13.0
  share_plus: ^12.0.1
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/images/vesta_logo.png
    - assets/images/LOGO_APP-ICON.png
    - assets/images/Dark.png
    - assets/images/choose_bank.png
    - assets/images/jopacc.png
    - assets/images/budgeting.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf